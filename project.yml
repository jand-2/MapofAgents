name: mapofagents
options:
  bundleIdPrefix: dev.mapofagents
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  MapofAgentsCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MapofAgentsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mapofagents.MapofAgentsCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  MapofAgentsUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MapofAgentsUI
    dependencies:
      - target: MapofAgentsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mapofagents.MapofAgentsUI
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  mapofagents-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/MapofAgentsApp/App/MapofAgentsApp.swift
      - path: Sources/MapofAgentsApp/Coordinators
      - path: Sources/MapofAgentsApp/IPhoneRootView.swift
      - path: Sources/MapofAgentsApp/Resources
    dependencies:
      - target: MapofAgentsCore
      - target: MapofAgentsUI
    settings:
      base:
        # Config/iOS/Info.plist is the source of truth for app plist keys.
        INFOPLIST_FILE: Config/iOS/Info.plist
        PRODUCT_NAME: mapofagents
        PRODUCT_BUNDLE_IDENTIFIER: dev.mapofagents.ios
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/iOS/mapofagents-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  mapofagents-iOS:
    build:
      targets:
        mapofagents-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
